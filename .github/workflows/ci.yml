name: ThingsBoard CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: thingsboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile & run unit tests
        run: >
          mvn clean test
          -pl='!application,!dao,!ui-ngx,!msa/js-executor,!msa/web-ui,!netty-mqtt'

      - name: Build ThingsBoard
        run: mvn package -DskipTests

      - name: Launch ThingsBoard
        run: |
          JAR=$(find application/target -name "thingsboard-*.jar" | head -n 1)

          java -jar "$JAR" \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/thingsboard \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres &

          sleep 60
